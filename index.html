<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Decode GitHub Pages SPA fallback redirects (/?/path&query)
      ;(function (l) {
        if (l.search[1] === '/') {
          const decoded = l.search
            .slice(1)
            .split('&')
            .map((s) => s.replace(/~and~/g, '&'))
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script>
      // Homepage: paint the paper colour and start the film's first frame before the bundle loads
      ;(function () {
        if (location.pathname !== '/') return
        document.documentElement.classList.add('rh-home')
        var s = document.createElement('style')
        s.textContent = 'html.rh-home,html.rh-home body{background:#f5f4ef}'
        document.head.appendChild(s)
        // same choice as pickMode() in src/routes/Home.tsx
        var w = innerWidth, h = innerHeight
        var still = matchMedia('(prefers-reduced-motion: reduce)').matches
        var wide = (w >= 1024 && h >= 560) || (w / h >= 1.2 && h >= 360)
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/film/v3/' + (wide || still ? 'd' : 'm') + '/f0000.avif'
        l.type = 'image/avif'
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruairí O'Flaherty | Mechanical engineering</title>
    <meta name="description" content="Ruairí O'Flaherty, mechanical engineering student at UCD. Projects, work experience and 3D printing." />
    <meta name="theme-color" content="#f5f4ef" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-bg text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
