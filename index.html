<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Decode GitHub Pages SPA fallback redirects (/?/path&query)
      ;(function (l) {
        if (l.search[1] === '/') {
          const decoded = l.search
            .slice(1)
            .split('&')
            .map((s) => s.replace(/~and~/g, '&'))
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script>
      // Apply theme before first paint to avoid dark-mode FOUC
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <script>
      // Homepage: paint the paper colour and start the film's first frame before the bundle loads
      ;(function () {
        if (location.pathname !== '/') return
        document.documentElement.classList.add('rh-home')
        var s = document.createElement('style')
        s.textContent = 'html.rh-home,html.rh-home body{background:#f5f4ef}'
        document.head.appendChild(s)
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/film/v1/f000.webp'
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruairi O'Flaherty — Portfolio</title>
    <meta name="description" content="Ruairi O'Flaherty — engineer and maker. Projects, experience, and 3D printing work." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07070c" />
  </head>
  <body class="bg-bg text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
